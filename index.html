<!-- ============================================================
     MODAL DEL BUSCADOR
     ============================================================ -->
<div class="modal-overlay" id="modal-buscador" onclick="if(event.target===this) cerrarBuscador()">
  <div class="modal-box modal-buscador">
    <input type="text" id="buscador-input" placeholder="Buscar en la guía… (Ctrl+K)" autocomplete="off" spellcheck="false">
    <div id="buscador-resultados"></div>
  </div>
</div>

<!-- ============================================================
     MODAL DE LA IDLE GENERAL
     ============================================================ -->
<div class="modal-overlay modal-idle-overlay" id="modal-idle" onclick="if(event.target===this) cerrarIdle()">
  <div class="modal-box modal-idle-box">

    <div class="idle-header">
      <h3>
        <span style="font-size:20px;">🐍</span>
        IDLE · Python libre
      </h3>
      <button class="idle-close" onclick="cerrarIdle()" title="Cerrar">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div class="idle-acciones">
      <button onclick="idleCrearNotebook()" title="Nuevo notebook .ipynb">
        <span class="material-symbols-outlined">note_add</span> Notebook
      </button>
      <button onclick="idleCrearPy()" title="Nuevo archivo .py">
        <span class="material-symbols-outlined">code</span> .py
      </button>
      <button onclick="idleImportar()" title="Importar archivo local">
        <span class="material-symbols-outlined">upload_file</span> Importar
      </button>
      <button onclick="idleRefrescar()" title="Refrescar lista">
        <span class="material-symbols-outlined">refresh</span>
      </button>
    </div>
    <input type="file" id="idle-import-input" accept=".py,.ipynb" style="display:none" onchange="idleImportarArchivo(event)">

    <div class="idle-lista-archivos" id="idle-lista-archivos">
      <div class="empty">Sin archivos guardados localmente</div>
    </div>

    <div class="idle-toolbar">
      <button onclick="idleCargarEjemplo()">
        <span class="material-symbols-outlined">menu_book</span> Ejemplos
      </button>
      <input type="text" id="idle-filename" value="scratch.ipynb" placeholder="nombre.ipynb">
      <button class="primary" onclick="ejecutarIdle()">
        <span class="material-symbols-outlined">play_arrow</span> Ejecutar
      </button>
      <button onclick="idleConvertir()" title="Convertir y guardar entre .py y .ipynb">
        <span class="material-symbols-outlined">swap_horiz</span> Convertir
      </button>
      <button onclick="idleDescargar()" title="Descargar archivo">
        <span class="material-symbols-outlined">download</span> Descargar
      </button>
      <button onclick="limpiarIdle()" title="Limpiar editor y salida">
        <span class="material-symbols-outlined">delete_sweep</span> Limpiar
      </button>
    </div>

    <div class="idle-editor-wrap">
      <textarea id="idle-editor"># IDLE Python libre
# Escribe tu código aquí y pulsa Ejecutar.
# Se guarda automáticamente en tu navegador.

print("Hola, mundo")
print(2 + 2)
</textarea>
    </div>

    <div class="idle-resize-handle" id="idle-resize-handle" title="Arrastra para redimensionar la salida"></div>

    <div class="idle-output" id="idle-output">Presiona Ejecutar para ver el resultado...</div>

  </div>
</div>
